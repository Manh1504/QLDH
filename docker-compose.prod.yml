# Deploy production: docker compose -f docker-compose.prod.yml up -d --build
# Yêu cầu file .env cạnh compose (copy từ .env.example rồi điền giá trị thật).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-azalas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?điền POSTGRES_PASSWORD vào .env}
      POSTGRES_DB: ${POSTGRES_DB:-azalas}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-azalas}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ghcr.io/manh1504/qldh-api:latest
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-azalas}:${POSTGRES_PASSWORD:?điền POSTGRES_PASSWORD vào .env}@postgres:5432/${POSTGRES_DB:-azalas}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?điền JWT secret vào .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?điền JWT secret vào .env}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_BUCKET: ${R2_BUCKET:-azalas}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY:-}
      R2_SECRET_KEY: ${R2_SECRET_KEY:-}
      R2_PUBLIC_BASE: ${R2_PUBLIC_BASE:-}
      API_PORT: "8010"
    ports:
      - "${API_PORT:-8010}:8010"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: ghcr.io/manh1504/qldh-web:latest
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8010/api}
    ports:
      - "${WEB_PORT:-8011}:8011"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
