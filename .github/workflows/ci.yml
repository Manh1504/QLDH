name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: azalas
          POSTGRES_PASSWORD: azalas
          POSTGRES_DB: azalas
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://azalas:azalas@localhost:5432/azalas?schema=public
      NEXT_PUBLIC_API_URL: http://localhost:8010/api
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npx prisma validate --schema packages/db/schema.prisma
      - run: npx prisma migrate deploy --schema packages/db/schema.prisma
      - run: npm run build --workspaces
