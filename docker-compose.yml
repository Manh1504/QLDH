services:
  postgres:
    image: postgres:16-alpine
    container_name: azalas-postgres
    environment:
      POSTGRES_USER: azalas
      POSTGRES_PASSWORD: azalas
      POSTGRES_DB: azalas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: azalas-redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
